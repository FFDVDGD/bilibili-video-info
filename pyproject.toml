[project]
name = "maibot-bilibili-video-info"
version = "0.1.4"
description = "拦截群聊 B 站视频链接并生成 AI 总结的 MaiBot 插件"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.0,<1.0.0",
    "maibot-plugin-sdk>=2.7.1,<3.0.0",
    "oss2>=2.19.1,<3.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0,<9.0.0",
    "pytest-asyncio>=0.25.0,<1.0.0",
    "ruff>=0.11.0,<1.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
